name: Catálogo de biblioteca (barrido)

# Copia el catálogo de la Biblioteca Virtual UNSA (Koha) al esquema `library` de Supabase.
# Ver docs/biblioteca-diagnostico.md.
#
# ⚠️ ANTES DE ACTIVARLO, LEE ESTO
#
# Este workflow necesita el secreto `DUTIC_LIBRARY_INGEST_KEY`. Si usas la `service_role`
# key del proyecto, ese secreto **salta TODO el RLS del proyecto entero**, incluidas las
# tablas con datos personales del piloto (students, whatsapp_sessions, telemetry.*). No es
# una clave "de biblioteca": es la llave maestra.
#
# Por eso aquí:
#   - NO corre en pull_request (un PR de un tercero nunca debe ver el secreto);
#   - el cron viene DESACTIVADO: actívalo sólo cuando decidas con qué clave corre;
#   - lo recomendable es acuñar un token acotado a un rol propio que sólo pueda ejecutar
#     las funciones de ingesta, en vez de usar service_role. Mientras no exista ese token,
#     correr el barrido desde tu propia máquina es la opción más segura.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental (2-3 peticiones) o full (tanda del barrido completo)"
        type: choice
        options: [incremental, full]
        default: incremental
      minutos:
        description: "Presupuesto de la tanda, sólo para modo full"
        type: string
        default: "30"
      sin_ventana:
        description: "Ignorar la ventana 00:00-06:00 (hora de Perú)"
        type: boolean
        default: false
  # Refresco diario de novedades: 02:30 en Lima (07:30 UTC). Descomenta para activarlo.
  # schedule:
  #   - cron: "30 7 * * *"

permissions:
  contents: read

concurrency:
  # Dos barridos a la vez pelearían por el mismo cursor y cargarían el doble al OPAC.
  group: library-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # El CLI comprueba la ventana horaria con la hora LOCAL del proceso; sin esto el
      # runner usaría UTC y la ventana caería cinco horas corrida.
      TZ: America/Lima
      DUTIC_LIBRARY_INGEST_KEY: ${{ secrets.DUTIC_LIBRARY_INGEST_KEY }}

    steps:
      - name: Comprobar que hay clave de ingesta
        run: |
          if [ -z "$DUTIC_LIBRARY_INGEST_KEY" ]; then
            echo "::error::Falta el secreto DUTIC_LIBRARY_INGEST_KEY; lee la cabecera de este workflow antes de crearlo."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Barrido
        run: |
          MODO="${{ inputs.modo || 'incremental' }}"
          ARGS=""
          [ "$MODO" = "incremental" ] && ARGS="--incremental"
          [ "$MODO" = "full" ] && ARGS="--minutos ${{ inputs.minutos || '30' }}"
          [ "${{ inputs.sin_ventana }}" = "true" ] && ARGS="$ARGS --sin-ventana"
          echo "dutic lib harvest $ARGS"
          node dist/cli/index.js lib harvest $ARGS --json | tee resultado.json

      - name: Resumen
        if: always()
        run: |
          if [ -f resultado.json ]; then
            node -e "
              const r = require('./resultado.json');
              const l = [
                '| métrica | valor |', '|---|---|',
                \`| run | #\${r.runId} (\${r.mode}) |\`,
                \`| estado | \${r.status} — \${r.stoppedBy} |\`,
                \`| filas escritas | \${r.recordsUpserted} |\`,
                \`| bloques ok / fallidos | \${r.blocksOk} / \${r.blocksFailed} |\`,
                \`| cursor | \${r.cursorOffset}\${r.total ? ' de ' + r.total : ''} |\`,
                \`| duración | \${(r.elapsedMs / 60000).toFixed(1)} min |\`,
              ];
              if (r.error) l.push(\`| error | \${r.error} |\`);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join('\n') + '\n');
            "
          fi

      # Una tanda que queda en `paused` es lo NORMAL (se acabó el presupuesto). Sólo se
      # marca en rojo si el run terminó como `failed`.
      - name: Fallar si el run quedó en failed
        if: always()
        run: |
          if [ -f resultado.json ] && [ "$(node -p "require('./resultado.json').status")" = "failed" ]; then
            echo "::error::El barrido terminó como failed: $(node -p "require('./resultado.json').error || ''")"
            exit 1
          fi
