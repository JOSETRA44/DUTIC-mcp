name: Catálogo de biblioteca (barrido)

# Mantiene al día la copia del catálogo de la Biblioteca Virtual UNSA (Koha) en el esquema
# `library` de Supabase. Ver docs/biblioteca-diagnostico.md.
#
# SE AUTOGESTIONA. Hay dos horarios y ninguno necesita que nadie vigile nada:
#
#   · 02:30 (Lima), todos los días → refresco incremental. Pide las novedades más recientes
#     y para en cuanto una página ya es conocida: 2-3 peticiones al OPAC.
#   · 01:00 (Lima), todos los días → una tanda de 45 min del barrido completo, que retoma el
#     cursor donde lo dejó la noche anterior. Con `--max-edad 30`, cuando el catálogo ya está
#     cosechado el comando NO toca el OPAC y termina en segundos; treinta días después vuelve
#     a barrer solo, para refrescar la foto de disponibilidad y recoger bajas.
#
# El barrido respeta la ventana 00:00-06:00 en hora de Perú (por eso TZ=America/Lima): si
# GitHub retrasa el job hasta el horario de clases, no carga el servidor de la universidad.
#
# SEGURIDAD. El secreto `DUTIC_LIBRARY_INGEST_TOKEN` NO es la service_role key: es un token
# propio que sólo sirve para llamar a la Edge Function `library-ingest`, que únicamente sabe
# escribir bibliografía. No puede leer `students`, `whatsapp_sessions` ni `telemetry`.
# Se acuña con `node scripts/mint-harvest-token.mjs` y se revoca con
# `select public.library_revoke_ingest_client('github-actions');`.

on:
  schedule:
    - cron: "30 7 * * *" # 02:30 en Lima → incremental
    - cron: "0 6 * * *" # 01:00 en Lima → tanda del barrido completo
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental (2-3 peticiones) o full (tanda del barrido completo)"
        type: choice
        options: [incremental, full]
        default: incremental
      minutos:
        description: "Presupuesto de la tanda, sólo para modo full"
        type: string
        default: "30"
      sin_ventana:
        description: "Ignorar la ventana 00:00-06:00 (hora de Perú)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Dos barridos a la vez pelearían por el mismo cursor y cargarían el doble al OPAC.
  group: library-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # El CLI comprueba la ventana horaria con la hora LOCAL del proceso; sin esto el
      # runner usaría UTC y la ventana caería cinco horas corrida.
      TZ: America/Lima
      DUTIC_LIBRARY_INGEST_TOKEN: ${{ secrets.DUTIC_LIBRARY_INGEST_TOKEN }}

    steps:
      - name: Comprobar que hay token de ingesta
        run: |
          if [ -z "$DUTIC_LIBRARY_INGEST_TOKEN" ]; then
            echo "::error::Falta el secreto DUTIC_LIBRARY_INGEST_TOKEN (node scripts/mint-harvest-token.mjs)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Barrido
        env:
          # Qué disparó el job: el cron de la 01:00 hace tanda completa; todo lo demás,
          # incremental (salvo que se pida otra cosa a mano).
          CRON: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ inputs.modo }}
          MINUTOS: ${{ inputs.minutos }}
          SIN_VENTANA: ${{ inputs.sin_ventana }}
        run: |
          set -o pipefail
          if [ -n "$MODO_MANUAL" ]; then
            MODO="$MODO_MANUAL"
            MINUTOS="${MINUTOS:-30}"
          elif [ "$CRON" = "0 6 * * *" ]; then
            MODO="full"
            MINUTOS="45"
          else
            MODO="incremental"
          fi

          ARGS="--json"
          if [ "$MODO" = "full" ]; then
            # --max-edad 30: si el catálogo ya está cosechado, no se toca el OPAC.
            ARGS="$ARGS --minutos $MINUTOS --max-edad 30"
          else
            ARGS="$ARGS --incremental"
          fi
          [ "$SIN_VENTANA" = "true" ] && ARGS="$ARGS --sin-ventana"

          echo "modo=$MODO"
          node dist/cli/index.js lib harvest $ARGS | tee resultado.json

      - name: Resumen
        if: always()
        run: |
          if [ -f resultado.json ]; then
            node -e "
              const r = require('./resultado.json');
              const l = [
                '| métrica | valor |', '|---|---|',
                \`| run | #\${r.runId} (\${r.mode}) |\`,
                \`| estado | \${r.status} — \${r.stoppedBy} |\`,
                \`| filas escritas | \${r.recordsUpserted} |\`,
                \`| bloques ok / fallidos | \${r.blocksOk} / \${r.blocksFailed} |\`,
                \`| cursor | \${r.cursorOffset}\${r.total ? ' de ' + r.total : ''} |\`,
                \`| duración | \${(r.elapsedMs / 60000).toFixed(1)} min |\`,
              ];
              if (r.error) l.push(\`| error | \${r.error} |\`);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join('\n') + '\n');
            "
          fi

      # `paused` (se acabó el presupuesto), `up_to_date` (ya estaba al día) y `window` (fuera
      # de horario) son resultados NORMALES de un cron. Sólo se marca en rojo un run `failed`.
      - name: Fallar si el run quedó en failed
        if: always()
        run: |
          if [ -f resultado.json ] && [ "$(node -p "require('./resultado.json').status")" = "failed" ]; then
            echo "::error::El barrido terminó como failed: $(node -p "require('./resultado.json').error || ''")"
            exit 1
          fi
