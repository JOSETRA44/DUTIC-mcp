name: Publicar en npm

# Se dispara al empujar una etiqueta de versión (v0.3.1, v0.4.0…):
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # procedencia (provenance) del paquete en npm

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      # Que la etiqueta y package.json no se contradigan: publicar una versión distinta de
      # la etiquetada deja el repositorio y el registro contando historias diferentes.
      - name: La etiqueta debe coincidir con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::La etiqueta v$TAG no coincide con package.json ($PKG)."
            exit 1
          fi

      - name: Publicar
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
